name: Sperant → Supabase ETL

on:
  schedule:
    - cron: "0 11 * * *" # 6am Lima = 11 UTC

  repository_dispatch:
    types: [trigger-etl]

  workflow_dispatch:
    inputs:
      lookback_months:
        description: "Months to reprocess (default 3)"
        required: false
        default: "3"
      only_projects:
        description: "Sperant codes to limit the run to, comma-separated (e.g. PALACIOS). Empty = all"
        required: false
        default: ""

permissions:
  issues: write
  # 🔴 Necesario para que Actions pueda emitir el token OIDC con el que el ETL
  # se autentica ante la edge function `sperant-etl-bridge`. Sin esto no hay
  # ACTIONS_ID_TOKEN_REQUEST_URL y el ETL cae al camino directo, que falla con
  # 401 porque `anon` ya no puede ejecutar las RPC (revocado el 17-ago-2026).
  # Es un permiso, no un secreto: no hay nada que rotar.
  id-token: write

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
          REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT }}
          REDSHIFT_DB: ${{ secrets.REDSHIFT_DB }}
          REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
          REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LOOKBACK_MONTHS: ${{ github.event.client_payload.lookback_months || github.event.inputs.lookback_months || '3' }}
          ONLY_PROJECTS: ${{ github.event.client_payload.only_projects || github.event.inputs.only_projects || '' }}
        run: python etl/sperant_etl.py

      # 🔴 Un solo hilo, no un issue por caída. Antes se creaba uno nuevo en cada
      # fallo: 41 abiertos entre abr y sep-2026, todos titulados «ETL failed» y con
      # un cuerpo que sólo traía el run id. Nadie los miraba, así que la caída del
      # 1-sep (502 del puente, 30 h sin datos) pasó inadvertida hasta que los
      # números de TunApp no cuadraron contra Meta.
      #
      # Ahora se comenta el hilo abierto si existe. Al cerrarlo, la próxima caída
      # abre uno nuevo — así cerrar el issue significa «lo revisé», no «lo tapé».
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const cuerpo = [
              `### Caída del ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
              '',
              `Rama/ref: \`${context.ref}\` · disparo: \`${context.eventName}\``,
              `Log del run: ${url}`,
              '',
              'Si el log muestra un **502 en `sperant-etl-bridge`**, suele ser transitorio:',
              'el ETL ya reintenta 3 veces (2/6/18 s). Que igual haya fallado significa',
              'que el puente estuvo caído más de medio minuto — relanzar el workflow y,',
              'si vuelve a fallar, revisar los logs de la edge function.',
              '',
              '🔴 Mientras esto siga rojo, TunApp muestra menos leads que Meta.',
            ].join('\n');

            const abiertos = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'etl-failure', per_page: 1,
            });

            if (abiertos.data.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: abiertos.data[0].number, body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: '🔴 ETL de Sperant caído',
                body: cuerpo,
                labels: ['etl-failure'],
              });
            }
