name: Diagnose Redshift — Proformas, unidades y cronograma

on:
  workflow_dispatch:
    inputs:
      sperant_code:
        description: "Código de proyecto en Sperant"
        required: false
        default: "ROMA"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install psycopg2-binary

      - name: Run diagnostic
        env:
          REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
          REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT }}
          REDSHIFT_DB:   ${{ secrets.REDSHIFT_DB }}
          REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
          REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
          SPERANT_CODE: ${{ github.event.inputs.sperant_code }}
        run: |
          python - <<'EOF'
          import os, psycopg2

          conn = psycopg2.connect(
              host=os.environ["REDSHIFT_HOST"],
              port=int(os.environ["REDSHIFT_PORT"]),
              dbname=os.environ["REDSHIFT_DB"],
              user=os.environ["REDSHIFT_USER"],
              password=os.environ["REDSHIFT_PASSWORD"],
              connect_timeout=30, sslmode="require",
          )
          cur = conn.cursor()
          code = os.environ.get("SPERANT_CODE") or "ROMA"

          def show(sql, params=None, title=""):
              print(f"\n--- {title}")
              try:
                  cur.execute(sql, params or ())
              except Exception as e:
                  conn.rollback(); print(f"   (error: {e})"); return []
              names = [d[0] for d in cur.description]
              rows = cur.fetchall()
              print("   " + " | ".join(names))
              for r in rows:
                  print("   " + " | ".join("" if v is None else str(v) for v in r))
              print(f"   ({len(rows)} filas)")
              return rows

          print(f"\n===== DETALLE PROFORMAS — {code} =====")

          # 1. Detalle por unidad de TODAS las proformas del proyecto
          show("""SELECT codigo_proforma, codigo_unidad, tipo_unidad, asignacion,
                         moneda, precio_venta, area_techada, area_libre, estado,
                         documento_cliente, corredor, afecto_igv, nota_proforma,
                         fecha_creacion
                  FROM tuna.proforma_unidad
                  WHERE codigo_proyecto = %s
                  ORDER BY codigo_proforma DESC, tipo_unidad, codigo_unidad""",
               (code,), title="1) proforma_unidad — detalle unidad por unidad")

          # 2. Cronograma completo de las proformas que YA tienen abono (= separadas)
          show("""SELECT p.codigo_proforma, p.nombres_cliente, p.apellidos_cliente,
                         p.documento_cliente, p.nombre, p.etiqueta, p.moneda_venta,
                         p.fecha_vcto, p.fecha_pago, p.monto_programado, p.monto_pagado,
                         p.saldo, p.estado, p.tipo_cronograma
                  FROM tuna.pagos p
                  WHERE p.codigo_proyecto = %s AND p.activo
                  ORDER BY p.codigo_proforma, p.fecha_vcto""",
               (code,), title="2) Cronograma de pagos completo")

          # 3. Abonos efectivamente recibidos
          show("""SELECT codigo_proforma, documento_cliente, fecha_abono, fecha_aplicacion,
                         monto_abono, moneda_abono_real, tipo_cambio, forma_pago,
                         numero_operacion, tipo_deposito, observacion
                  FROM tuna.abonos WHERE codigo_proyecto = %s
                  ORDER BY fecha_abono""",
               (code,), title="3) Abonos recibidos")

          # 4. Estado actual de las unidades según el CRM
          show("""SELECT codigo_unidad, nombre_unidad, tipo_unidad, estado,
                         precio_venta, area_techada, area_libre
                  FROM tuna.unidades WHERE codigo_proyecto = %s
                  ORDER BY tipo_unidad, codigo_unidad""",
               (code,), title="4) Unidades del proyecto (tuna.unidades)")

          cur.close(); conn.close()
          print("\n===== FIN =====")
          EOF
