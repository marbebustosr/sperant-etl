name: Auditoría diaria — Leads Sheet vs Sperant

on:
  schedule:
    - cron: "0 13 * * *" # 8am Lima = 13 UTC (después del ETL de 6am)

  workflow_dispatch:
    inputs:
      sheet_id:
        description: "Google Sheet ID (default: repo variable LEADS_SHEET_ID)"
        required: false
        default: ""
      year:
        description: "Año a auditar (default: año actual)"
        required: false
        default: ""
      month:
        description: "Mes a auditar (default: mes actual)"
        required: false
        default: ""

permissions:
  issues: write
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r audit/requirements.txt

      - name: Ejecutar auditoría
        id: audit
        continue-on-error: true
        env:
          REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
          REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT }}
          REDSHIFT_DB: ${{ secrets.REDSHIFT_DB }}
          REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
          REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
          LEADS_SHEET_ID: ${{ github.event.inputs.sheet_id != '' && github.event.inputs.sheet_id || vars.LEADS_SHEET_ID }}
          AUDIT_YEAR: ${{ github.event.inputs.year }}
          AUDIT_MONTH: ${{ github.event.inputs.month }}
        run: |
          set +e
          python audit/audit_leads.py 2>&1 | tee /tmp/audit_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Guardar snapshot diario (commit al repo)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/history/ 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "chore(audit): snapshot diario $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          else
            echo "Sin cambios en snapshot (ya existe el de hoy)."
          fi

      - name: Crear/actualizar issue si hay faltantes
        if: steps.audit.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Asegurar que el label exista (idempotente)
          gh label create audit-leads --color C0392B \
            --description "Auditoría leads Meta vs Sperant" 2>/dev/null || true

          TODAY=$(date -u +%Y-%m-%d)
          TITLE="🔴 Auditoría leads — faltantes detectados ($TODAY)"
          BODY_FILE=/tmp/issue_body.md
          {
            echo "Auditoría automática diaria. Hay leads en el Google Sheet de Meta que **no concilian** con Sperant."
            echo ""
            echo "Revisar el resumen (columna **Salud**: \`GAP OPERATIVO\` = el equipo no creó los manuales que debía)."
            echo ""
            echo '```'
            sed -n '/RESUMEN GLOBAL/,$p' /tmp/audit_output.txt
            echo '```'
            echo ""
            echo "Detalle completo (JSON) en el log del run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "cc @marbebustosr — reenviar a Alonso (alonso@tuna.pe) y Javier (javier@tuna.pe) si el gap persiste."
          } > "$BODY_FILE"

          # Reusar issue abierto del día si existe; si no, crear nuevo
          EXISTING=$(gh issue list --label audit-leads --state open --search "$TODAY in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label audit-leads
          fi

      - name: Preparar asunto y cuerpo HTML del email
        if: always()
        id: mail
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          EC="${{ steps.audit.outputs.exit_code }}"
          if [ "$EC" = "2" ]; then
            echo "subject=🔴 Auditoría leads $TODAY — faltantes / gap operativo" >> "$GITHUB_OUTPUT"
            COLOR="#C0392B"; ICON="🔴"; ESTADO="Faltantes / gap operativo detectado"
            INTRO="Hay leads en el Google Sheet de Meta que <b>no concilian</b> con Sperant. Revisa la columna <b>Salud</b>."
          elif [ "$EC" = "0" ]; then
            echo "subject=✅ Auditoría leads $TODAY — conciliación OK" >> "$GITHUB_OUTPUT"
            COLOR="#16A34A"; ICON="✅"; ESTADO="Conciliación OK — sin faltantes"
            INTRO="Todos los leads del Google Sheet de Meta concilian con Sperant. Sin acción requerida."
          else
            echo "subject=⚠️ Auditoría leads $TODAY — el script falló (revisar)" >> "$GITHUB_OUTPUT"
            COLOR="#D97706"; ICON="⚠️"; ESTADO="El script falló — revisar el run"
            INTRO="La auditoría no pudo completarse. Revisa el log del run."
          fi

          # Reporte (desde RESUMEN GLOBAL) escapado para HTML
          REPORTE=$(sed -n '/RESUMEN GLOBAL/,$p' /tmp/audit_output.txt 2>/dev/null \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          [ -z "$REPORTE" ] && REPORTE="(sin salida — el script no llegó a ejecutar)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          cat > /tmp/mail_body.html <<HTMLEOF
          <!DOCTYPE html><html><body style="margin:0;padding:24px;background:#f4f4f5;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <div style="max-width:780px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;">
              <div style="background:${COLOR};color:#ffffff;padding:20px 26px;">
                <div style="font-size:19px;font-weight:700;">${ICON}&nbsp; Auditoría Leads — Meta vs Sperant</div>
                <div style="font-size:13px;opacity:.92;margin-top:4px;">${TODAY} &nbsp;·&nbsp; ${ESTADO}</div>
              </div>
              <div style="padding:22px 26px;">
                <p style="margin:0 0 16px;color:#3f3f46;font-size:14px;line-height:1.5;">${INTRO}</p>
                <pre style="background:#0f172a;color:#e2e8f0;padding:18px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre;margin:0;">${REPORTE}</pre>
                <div style="margin:18px 0 0;background:#f8fafc;border:1px solid #e4e4e7;border-radius:8px;padding:16px 18px;">
                  <div style="font-size:13px;font-weight:700;color:#1f2937;margin-bottom:10px;">📖 Cómo leer este reporte</div>
                  <div style="font-size:12px;color:#3f3f46;line-height:1.7;">
                    Cada lead del Excel de Meta se clasifica en una categoría:
                    <ul style="margin:8px 0;padding-left:18px;">
                      <li><b>Nuevo</b> — Lead nuevo que entró correctamente a Sperant este mes. ✅ Lo ideal, no requiere acción.</li>
                      <li><b>Recap</b> (recapturado histórico) — La persona <b>ya estaba en Sperant en este mismo proyecto</b> de un mes anterior. Meta lo vuelve a cobrar pero no es un lead nuevo. No requiere acción.</li>
                      <li><b>Cross</b> (recapturado cross-proyecto) — La persona <b>ya estaba en Sperant pero en OTRO proyecto</b>. Llega por Meta a este proyecto pero ya era cartera nuestra. No requiere acción.</li>
                      <li><b>Test</b> — Lead de prueba/basura: teléfono falso (7777777, 1234567…), email tipo "noexisto/test/prueba". No es una persona real. No requiere acción.</li>
                      <li><b>FALTA</b> (faltante real) — 🔴 Lead que <b>NO existe en Sperant por ningún dato</b> (email, teléfono, DNI ni nombre). Es un lead pagado que nunca entró al CRM. <b>Requiere crearlo manualmente.</b></li>
                      <li><b>Manual</b> — Cuántos leads creó el equipo a mano en Sperant ese mes. Es la evidencia de que la conciliación se está haciendo.</li>
                    </ul>
                    <b>Salud</b> (semáforo del proyecto):
                    <code>OK</code> = 0 faltantes &nbsp;·&nbsp;
                    <code>REVISAR</code> = hay faltantes pero se crearon manuales suficientes &nbsp;·&nbsp;
                    <code>GAP&nbsp;OPERATIVO</code> = faltantes &gt; manuales → el equipo <b>no está conciliando</b> 🔴
                    <br><br>
                    <b>Movimiento vs día anterior</b> —
                    <code>ΔSheet</code> leads que Alonso agregó al Excel &nbsp;·&nbsp;
                    <code>ΔSperant</code> clientes nuevos al CRM (sync auto + manual) &nbsp;·&nbsp;
                    <code>ΔManual</code> reconciliados a mano &nbsp;·&nbsp;
                    <code>ΔFaltan</code> variación de faltantes (sube = peor). &nbsp;
                    "⚠ Sheet creció, 0 manuales" = Alonso subió leads pero nadie los reconcilió ese día.
                  </div>
                </div>
              </div>
              <div style="padding:14px 26px;background:#fafafa;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">
                <a href="${RUN_URL}" style="color:#2563eb;text-decoration:none;">Ver run completo en GitHub →</a>
                &nbsp;·&nbsp; Reenviar a Alonso (alonso@tuna.pe) y Javier (javier@tuna.pe) si el gap persiste.
              </div>
            </div>
          </body></html>
          HTMLEOF

      - name: Enviar email del resultado (siempre)
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: marbe@tuna.pe
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.mail.outputs.subject }}
          to: marbe@tuna.pe
          cc: alonso@tuna.pe,javier@tuna.pe
          from: Auditoría Leads TUNA <marbe@tuna.pe>
          html_body: file:///tmp/mail_body.html

      - name: Fail job si hubo faltantes
        if: steps.audit.outputs.exit_code == '2'
        run: |
          echo "Faltantes detectados — ver email + issue audit-leads."
          exit 1
